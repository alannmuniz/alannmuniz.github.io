# SAGüi — programação, histórico e resumos dos cartazes originais.
# Datas em formato AAAA-MM-DD. Resumos em HTML; fórmulas entre \( e \).

- number: 1
  speaker: "Aron Simis"
  affiliation: "UFPE"
  title: "Aspectos de uma abordagem algébrica de campos vetoriais"
  date: "2024-05-14"
  year: 2024
  date_label: "14 de maio de 2024"
  abstract: "<p>Uma introdução aos elementos de álgebra comutativa que intervêm na geometria dos campos vetoriais, com ênfase em derivações e diferenciais de Kähler. A trama é salientar um quociente graduado conveniente \\(E\\) do módulo de derivações \\(\\operatorname{Der}(R)\\) do anel de coordenadas homogêneas \\(R\\) de uma variedade projetiva \\(X\\), de modo que seu grau inicial restitua o menor grau de um campo vetorial mantendo X invariante e sem se anular ao longo de \\(X\\). Dessa maneira, o chamado problema de Poincaré se reduz a determinar limites superiores para o grau inicial de \\(E\\). Detalhes e exemplos serão mencionados, sem demonstração.</p>"

- number: 2
  speaker: "Rodrigo Gondim"
  affiliation: "UFRPE"
  title: "On higher Jacobians, Laplace equations and Lefschetz properties"
  date: "2024-05-28"
  year: 2024
  date_label: "28 de maio de 2024"
  abstract: "<p>Let \\(A\\) be a standard graded \\(K\\)-algebra of finite type over an algebraically closed field of characteristic zero. We use apolarity to construct, for each degree \\(k\\), a projective variety whose osculating defect in degree \\(s\\) is equivalent to the non-maximality of the rank of the multiplication map for a power of a general linear form \\(\\times L^{k-s}:A_s\\longrightarrow A_k\\) . In the Artinian case, this notion corresponds to the failure of the Strong Lefschetz property for \\(A\\), which allows to reobtain some of the foundational theorems in the field. It also implies the SLP for codimension-two Artinian algebras, a known result. The results presented in this work provide new insights into the geometry of monomial Togliatti systems, and offer a geometric interpretation of the vanishing of higher-order Hessians.</p>"

- number: 3
  speaker: "Douglas Queiroz"
  affiliation: "IFPB"
  title: "Regularity of Rees algebras and application to a H. Dao problem"
  date: "2024-06-11"
  year: 2024
  date_label: "11 de junho de 2024"
  abstract: "<p>The regularity (of Castelnuovo-Mumford) is a celebrated numerical invariant in commutative algebra and algebraic geometry. Regarding this invariant, our goal in this work is twofold. Firstly, we present recent results on the regularity of the Rees algebra of certain ideals, especially its close relationship with the reduction number of the given ideal (with which we generalize a result by A. Mafi), as well as its explicit determination in the case of Ulrich ideals. Finally, we utilize such regularity in our proposed solution to a recent question posed by H. Dao concerning what we now call ”Dao numbers,” which are intimately related to the celebrated ”fullness” properties of ideals.</p>"

- number: 4
  speaker: "Thiago Fiel"
  affiliation: "UFPE"
  title: "Buchsbaum–Eisenbud complexes in a Koszul–Čech spectral sequence approach"
  date: "2024-06-25"
  year: 2024
  date_label: "25 de junho de 2024"
  abstract: "<p>This talk will present an interesting algebraic treatment to the family of Buchsbaum-Eisenbud complexes via Koszul-Čech spectral sequences, which enabled us to give, a little bit different, generalized Serre’s formula for the Buchsbaum-Rim multiplicity of a module. This family of complexes extends the notion of the Koszul complex for a matrix, and it includes the Eagon-Northcott and the Buchsbaum-Rim complexes, useful tools to understand some properties of a module, such as depth and multiplicity, for example. In 1964, Buchsbaum and Rim introduced the multiplicity for a module that bears their names as a generalization of the Hilbert-Samuel multiplicity. Although there was no geometric sense at the beginning, some geometers have proven the relevance of this multiplicity, in particular Gaffney’s works, in the 90’s, extending Teissier’s work, about hypersurfaces with isolated singularities, to the context in a higher codimension. Hassanzadeh and Bouça initiated the Koszul-Čech approach of the Buchsbaum-Eisenbud complexes in 2019 when they were studying residual intersections, and I have continued to search algebraic properties of the Koszul-Čech structure in the study of multiplicities and residual intersections.</p>"

- number: 5
  speaker: "Bárbara Costa"
  affiliation: "UFRPE"
  title: "Propriedades de Lefschetz da artinianização quadrática de Stanley–Reisner e de sua idealização"
  date: "2024-08-13"
  year: 2024
  date_label: "13 de agosto de 2024"
  abstract: "<p>As propriedades Lefschetz tem atraido a atenção de muitos pesquisadores em diversas áreas incluindo Álgebra Comutativa, Geometria Algébrica e Combinatória. Neste trabalho estudamos as propriedades Lefschetz em álgebras artinianas Gorenstein graduada standard quadráticas, associadas a um complexo simplicial \\(\\Delta\\), que são a artinianização quadrática de Stanley-Reisner de \\(\\Delta\\), denotado por \\(A_\\Delta\\), e a idealização de Nagata de \\(A_\\Delta\\), denotada por \\(B_\\Delta\\).</p><p>Apresentaremos uma condição necessária e suficiente para que a artinianização quadrática de Stanley-Reisner associada a pseudo-variedade flag de dimensão 2 e sua idealização de Nagata possuam a propriedade Lefschetz fraca (WLP), mais ainda</p><p><strong>Teorema (Costa, B.; Gondim, R.).</strong> Seja \\(\\Delta\\) uma pseudo variedade flag de dimensão 2 e seja \\(G=G_\\Delta\\) seu grafo dual. Seja \\(A=A_\\Delta\\) a artinianização quadrática de Stanley-Reisner associada a \\(\\Delta\\) e \\(B=B_\\Delta\\) sua idealização. Então as seguintes afirmações são equivalentes:</p><ol type=\"i\"><li>\\(A\\) tem a WLP.</li><li>\\(B\\) tem a WLP.</li><li>\\(G\\) tem pelo menos um cíclo ímpar.</li></ol><p>Mais ainda, \\(B\\) sempre falha a propriedade Lefschetz forte (SLP).</p>"

- number: 6
  speaker: "Lenin Bezerra"
  affiliation: "UFPE"
  title: "Propriedades de Lefschetz para álgebras de Gorenstein Artinianas de codimensão quatro"
  date: "2024-08-20"
  year: 2024
  date_label: "20 de agosto de 2024"
  abstract: "<p>Para álgebras de Gorenstein Artinianas em codimensão quatro, é bem conhecido que há álgebras que falham na Propriedade Fraca de Lefschetz (WLP), Ikeda mostrou o primeiro exemplo de tal álgebra. Neste trabalho, damos uma família de álgebras que falham na propriedade fraca de Lefschetz e estudamos as condições no vetor de Hilbert de uma álgebra de Gorenstein artiniana para a qual essa álgebra tem WLP ou não.</p>"

- number: 7
  speaker: "Ugo Bruzzo"
  affiliation: "SISSA"
  title: "Super Grothendieck–Riemann–Roch and applications"
  date: "2024-09-06"
  year: 2024
  date_label: "6 de setembro de 2024"
  abstract: "<p>We shall review the formulation of the Manin-Penkov-Voronov super Grothendieck-Riemann-Roch theorem and will show how to use it to compute the virtual dimension of some moduli spaces (in particular, the moduli superstacks of stable SUSY curves and stable supermaps).</p>"

- number: 8
  speaker: "Letterio Gatto"
  affiliation: "Politecnico di Torino"
  title: "Brincando com derivações da Álgebra Exterior"
  date: "2024-09-17"
  year: 2024
  date_label: "17 de setembro de 2024"
  abstract: "<p>Depois de uma rápida revisão da noção de álgebra exterior, analisaremos as derivações sobre ela, em particular as de grau zero e as de grau −1. Discutiremos como estas derivações se tornam úteis seja na matemática clássica, tal qual o famoso teorema do Cayley-Hamilton, assim como no estudo das teorias de representações da álgebra de Lie das matrizes de posto enumerável (possivelmente infinito). A palestra, baseada em trabalho desenvolvido com vários colaboradores, é pensada para uma audiência geral.</p>"

- number: 9
  speaker: "Tomás S. R. Silva"
  affiliation: "UNICAMP"
  title: "From Theory to Computation: Unraveling Hyperplane Arrangements"
  date: "2024-09-24"
  year: 2024
  date_label: "24 de setembro de 2024"
  abstract: "<p>A hyperplane arrangement is a finite collection of codimension-one affine subspaces within a finite-dimensional vector space. The study of these arrangements draws from various branches of mathematics, uncovering deep and often surprising connections between combinatorics, algebra, algebraic geometry, and topology. In this seminar, we will explore some of the intriguing properties of hyperplane arrangements and highlight the computational challenges that arise in their analysis.</p>"

- number: 10
  speaker: "Thiago Dias Oliveira Silva"
  affiliation: "UFRPE"
  title: "The Veronese variety associated with Dziobek central configurations"
  date: "2024-10-08"
  year: 2024
  date_label: "8 de outubro de 2024"
  abstract: "<p>In this seminar, we will define the Veronese variety related to Dziobek central configurations and use this concept to provide new proof for the finiteness of Dziobek central configurations. Also, we will view the set of central configurations of \\(n\\) bodies in \\(\\mathbb{R}^d\\) as a subset of an appropriate Grassmannian variety.</p>"

- number: 11
  speaker: "Eudes Naziazeno"
  affiliation: "UFPE"
  title: "Mas se a parte faz o todo, sendo parte, não se diga que é parte, sendo todo"
  date: "2024-11-19"
  year: 2024
  date_label: "19 de novembro de 2024"
  abstract: "<p>Como já bem sabido, as álgebras finitamente geradas sobre um anel podem ser caracterizadas pelo conjunto de geradores e pelas relações entre eles. Durante a palestra, trabalharemos com álgebras finitamente geradas sobre o corpo dos complexos, explorando essas relações. O interesse é estudar a lógica de primeira ordem dessas estruturas algébricas, a partir da bi-interpretabilidade com uma estrutura base “quase pré-fixada”.</p>"

- number: 12
  speaker: "Anne C. C. de Albuquerque"
  affiliation: "UFMG"
  title: "Sobre Curvas Racionais e Instantons"
  date: "2024-11-26"
  year: 2024
  date_label: "26 de novembro de 2024"
  abstract: "<p>Além da sua conexão com o estudo da física, os fibrados instanton podem ser aplicados ao estudo dos espaços de moduli de fibrados vetoriais em variedades projetivas. Hartshorne provou que existe uma correspondência entre subesquemas de codimensão 2 em uma variedade projetiva não-singular e fibrados vetoriais de posto 2. Existe uma relação entre os fibrados vetoriais instanton de posto 3 em \\(\\mathbb{P}^3\\) de carga \\(n\\) e sua conexão com curvas racionais de grau \\(n+3\\), exibindo uma condição suficiente para que um fibrado vetorial de posto 3 seja um fibrado instanton por meio do cálculo das seções globais do determinante do fibrado normal de uma curva suave que é interseção completa em \\(\\mathbb{P}^3\\) . Neste trabalho, encontraremos uma condição análoga para um fibrado vetorial de posto 3 ser um instanton através de uma curva racional com singularidades ordinárias em \\(\\mathbb{P}^3\\) . Tal caracterização será obtida através de uma adaptação do método utilizado por Alzati-Re, o qual consiste em descrever o fibrado normal da curva através de um quociente pelo fibrado tangente restrito e uma projeção da curva normal racional.</p>"

- number: 13
  speaker: "Fábio Arceu"
  affiliation: "UFPB"
  title: "Crepant resolutions of Gorenstein abelian quotient singularities"
  date: "2025-03-18"
  year: 2025
  date_label: "18 de março de 2025"
  abstract: "<p>Let \\(G\\) be a finite abelian subgroup of \\(\\operatorname{SL}(n,\\mathbb{C})\\), and suppose there exists a crepant resolution \\(\\phi:X\\longrightarrow\\mathbb{C}^n/G\\) of the (Gorenstein) quotient variety \\(\\mathbb{C}^n/G\\). In this situation, the exceptional set of \\(\\phi\\) is pure of codimension 1. Furthermore, it is known that \\(\\mathbb{C}^n/G\\) is a toric variety, and any crepant resolution of such a variety is also toric. Using the tools provided by toric geometry, in this talk I will prove that, for each irreducible component \\(E_i\\) of \\(\\operatorname{Exc}(\\phi)\\), there exists an open subset \\(U_i\\) of \\(X\\) such that \\(E_i\\subset U_i\\), and \\(U_i\\) is the total space of the canonical bundle \\(\\omega_{E_i}\\) of \\(E_i\\). Furthermore, \\(X=U_1\\cup\\cdots\\cup U_s\\). In particular, when \\(s=1\\), we obtain that the resolution \\(X\\) itself is a line bundle over \\(\\operatorname{Exc}(\\phi)\\).</p>"

- number: 14
  speaker: "João Paulo Costalonga"
  affiliation: "UFES"
  title: "Propriedades de Lefschetz em Álgebras de Estruturas Combinatórias"
  date: "2025-04-08"
  year: 2025
  date_label: "8 de abril de 2025"
  abstract: "<p>Vamos falar sobre Propriedades de Lefschetz em quocientes de anéis de polinômios sobre um corpo por um ideal definido a partir de uma estrutura combinatória, citando alguns resultados existentes a esse respeito e apresentando nossos resultados e métodos novos. Em particular falaremos sobre ideais definidos por: </p><ul><li>Geometrias abstratas finitas;</li><li>Matroides de posto até três;</li><li>Arestas em grafos;</li><li>Conjuntos independentes de vértices em grafos.</li></ul><p> O arcabouço teórico para o pleno entendimento da palestra consiste em ordem de prioridade: quocientes em anéis de polinômios e um primeiro curso de álgebra linear, definição de grafo e características em corpos.</p>"

- number: 15
  speaker: "Aislan Fontes"
  affiliation: "UFS"
  title: "Classification of Monads and Moduli Components of Stable Rank-two Bundles with c1 = −1 and c2 = 10"
  date: "2025-04-22"
  year: 2025
  date_label: "22 de abril de 2025"
  abstract: "<p>In this talk, we provide a complete classification of the positive minimal monads whose cohomology is a stable rank-2 bundle on the projective space with Chern classes equal to \\(c_1=-1\\) and \\(c_2=10\\), and we prove the existence of two new components of the moduli space \\(\\mathcal{B}(-1,10)\\). For this, we play with three ways of classifying vector bundles of rank 2 on \\(\\mathbb{P}^3\\) : the Hartshorne-Serre correspondence, the Horrocks method, and in terms of spectrum. This is a work in collaboration with Marcos Jardim.</p>"

- number: 16
  speaker: "Geisa Gama"
  affiliation: "UFPE"
  title: "Codimension two perfect monomial ideals"
  date: "2025-05-13"
  year: 2025
  date_label: "13 de maio de 2025"
  abstract: "<p>We are interested in linearly presented monomial perfect ideals \\(I\\) of codimension two in a polynomial ring \\(R\\) over a field of characteristic zero. The overall interest is in the homological nature of the main algebras related to the Hilbert-Burch syzygy matrix associated to \\(I\\), and in particular, in the Cohen-Macaulay property of the Rees algebra and the special fiber of \\(I\\). The case where \\(\\dim R=3\\) and \\(R/I\\) has only two minimal primes was discussed in a previous work of Doria, Ramos, and Simis. In this dimension, we focus on the case where \\(R/I\\) has three minimal primes (maximum possible), which seems to require a different approach. In higher-dimensional \\(R\\), we also look at aspects of the radical and primary decomposition.</p>"

- number: 17
  speaker: "Kézia Mestre"
  affiliation: "UFPE"
  title: "Propriedades de Lefschetz para álgebras Artinianas Gorenstein de codimensão 4"
  date: "2025-06-03"
  year: 2025
  date_label: "3 de junho de 2025"
  abstract: "<p>Nesse trabalho estudamos as propriedades fraca e forte de Lefschetz para álgebras Artinianas Gorenstein de codimensão quatro. A ideia é generalizar resultados prévios em socle degree baixo para qualquer grau do socle e classificar todas as possíveis funções de Hilbert dessas álgebras.</p>"

- number: 18
  speaker: "Raphael Omena"
  affiliation: "UFC"
  title: "Sobre a Invariância do Número de Milnor"
  date: "2025-06-17"
  year: 2025
  date_label: "17 de junho de 2025"
  abstract: "<p>No contexto de germes de funções holomorfas, Milnor mostrou que, se \\(f\\) possui uma singularidade isolada na origem, então a fibra singular intersectada com uma esfera suficientemente pequena é homotopicamente equivalente a um buquê de \\(\\mu(f)\\) esferas. Posteriormente, Lê demonstrou que o número de Milnor é um invariante topológico para esse tipo de germes: se houver um homeomorfismo do ambiente que leva o conjunto de zeros de \\(f\\) no de \\(g\\), então \\(\\mu(f)\\) = \\(\\mu(g)\\). No caso real, no entanto, o número de Milnor pode variar sob equivalências diferenciáveis, mesmo \\(C^1\\) . Neste seminário, discutiremos condições suficientes sob as quais o número de Milnor real permanece invariante. Mostraremos, por exemplo, que se dois germes \\(f\\) e \\(g\\) têm partes iniciais com singularidades algebricamente isoladas e são equivalentes sob uma transformação assintoticamente Lipschitz, então eles têm o mesmo número de Milnor. Além disso, discutiremos a equivalência \\(C^k\\) e suave em um contexto mais geral. Este é um trabalho conjunto com Edson Sampaio (UFC) e Emanoel Souza (UECE).</p>"

- number: 19
  speaker: "Paula Cadavid"
  affiliation: "UFRPE"
  title: "Álgebras de Evolução e Grafos"
  date: "2025-08-12"
  year: 2025
  date_label: "12 de agosto de 2025"
  abstract: "<p>As álgebras de evolução, um tipo de álgebra não associativa introduzida em 2006 por J. Tian e Vojtechovsky, foram desenvolvidas para estudar fenômenos relacionados à genética não mendeliana. Em 2015, Elduque e Labra definiram o grafo associado a uma álgebra de evolução, estabelecendo uma conexão significativa entre esses dois conceitos. Desde então, essa relação tem sido amplamente utilizada como uma ferramenta eficaz para investigar as propriedades dessas álgebras. Neste seminário, apresentarei alguns dos resultados obtidos por meio dessa abordagem.</p>"

- number: 20
  speaker: "Bárbara Costa"
  affiliation: "UFRPE"
  title: "Especulações sobre as propriedades de Lefschetz em álgebras artinianas combinatórias"
  date: "2025-08-26"
  year: 2025
  date_label: "26 de agosto de 2025"
  abstract: "<p>Em pesquisas recentes foram estudadas as propriedades de Lefschetz na artinianização quadrática de anéis de Stanley Reisner associados a complexos simpliciais. Dentre os complexos estudados podemos citar os de dimensão pura igual a 1 e 2 e os complexos de independentes de caminhos, ciclos, grafo estrela, grafo roda e grafo whiskered. Surge então uma questão: os resultados obtidos para artinianização quadrática desses complexos podem ser expandidos quando consideramos outros tipos de artinianização? Nesta apresentação mostraremos os avanços na pesquisa das propriedades de Lefschetz na d-artinianização dos anéis de Stanley Reisner associados a alguns dos complexos acima.</p>"

- number: 21
  speaker: "Rodrigo Gondim"
  affiliation: "UFRPE / PPGDMat-UFPE"
  title: "Cox-Gorenstein algebras"
  date: "2025-09-09"
  year: 2025
  date_label: "9 de setembro de 2025"
  abstract: "<p>We study \\(G\\)-graded Artinian algebras having Poincaré duality and their Lefschetz properties. We prove the equivalence between the toric setup and the \\(G\\)-graded one. We prove a Hessian criterion in the \\(G\\)-graded setup. We provide an application to toric geometry. (joint with U. Bruzzo, R. Holanda, W. Montoya)</p>"

- number: 22
  speaker: "Rafael Holanda"
  affiliation: "UFPE"
  title: "Uma demonstração algébrica para o Teorema da Codimensão Um"
  date: "2025-09-23"
  year: 2025
  date_label: "23 de setembro de 2025"
  abstract: "<p>Em 1996, David Cox provou que dada uma variedade tórica projetiva de dimensão \\(n\\), o seu anel de coordenadas módulo \\(n+1\\) formas equigeradas em grau amplo que não compartilham zeros deve ter dimensão um na componente do grau crítico das formas. Este resultado, conhecido por Teorema da Codimensão Um, foi generalizado por Cattani-Cox-Dickenstein e ainda mais por Cox-Dickenstein. Discutiremos um pouco estas generalizações e os ingredientes geométricos de suas demonstrações. Encerraremos com uma demonstração algébrica do teorema de Cox para o caso de um produto de espaços projetivos.</p>"

- number: 23
  speaker: "Thyago Souza"
  affiliation: "UFCG"
  title: "Alguns resultados recentes na teoria de linkage"
  date: "2025-10-21"
  year: 2025
  date_label: "21 de outubro de 2025"
  abstract: "<p>A teoria de linkage de ideais foi introduzida por Peskine e Szpiro em 1974 e, posteriormente, estendida ao contexto de módulos por diversos autores, sob diferentes abordagens. Nesta palestra, apresentaremos resultados recentes na teoria de linkage de módulos relativa a um módulo semidualizante \\(C\\), proposta em 2018 por Dibaei e Sadeghi. Discutiremos conexões entre módulos ligados horizontalmente com respeito a \\(C\\) e tópicos de interesse em álgebra comutativa, tais como dimensões homológicas, classes especiais de módulos e cohomologia local.</p>"

- number: 24
  speaker: "Êmyle Myrelle"
  affiliation: "UFPE"
  title: "Teorema de Serre: Uma Caracterização Homológica para Anéis Regulares"
  date: "2025-11-04"
  year: 2025
  date_label: "4 de novembro de 2025"
  abstract: "<p>Em meados do século XX, matemáticos como Jean-Pierre Serre, Maurice Auslander e David Buchsbaum contribuíram, por métodos homológicos, para o avanço do estudo dos anéis regulares, fundamentais na Álgebra Comutativa e na Geometria Algébrica. Entre os principais resultados desse período, destaca-se o Teorema de Serre, que caracteriza os anéis locais regulares através da finitude da dimensão homológica do seu corpo residual. Nesta palestra, apresentaremos uma demonstração desse teorema, bem como alguns corolários e aplicações que evidenciam sua relevância teórica.</p>"

- number: 25
  speaker: "Ugo Bruzzo"
  affiliation: "UFMG"
  title: "On the stack of stable supermaps"
  date: "2025-11-11"
  year: 2025
  date_label: "11 de novembro de 2025"
  abstract: "<p>We introduce stable supermaps and describe some aspects of the structure of their moduli superstack.</p>"

- number: 26
  speaker: "Victor Cordeiro"
  affiliation: "Unicamp"
  title: "Folheações por curvas em variedades de dimensão 3"
  date: "2026-03-03"
  year: 2026
  date_label: "3 de março de 2026"
  abstract: "<p>Apresentaremos um panorama geral e clássico da teoria de folheações por curvas, evoluindo para uma abordagem algébrica em variedades de dimensão 3. O foco central será o estudo de folheações em hipersuperfícies suaves em espaços projetivos de dimensão 4, analisando os campos de vetores que induzem tais estruturas, bem como seu lugar singular e suas propriedades geométricas nessas variedades.</p>"

- number: 27
  speaker: "Felipe Monteiro"
  affiliation: "Unicamp"
  title: "Diferenciais Logarítmicas e graus de Bourbaki"
  date: "2026-04-07"
  year: 2026
  date_label: "7 de abril de 2026"
  abstract: "<p>Módulos de diferenciais com pólos logarítmicos ao longo de um divisor foram introduzidos nos anos 70 por Deligne e Saito, com problemas envolvendo áreas como a álgebra comutativa, geometria algébrica, combinatória e topologia. Uma abordagem clássica é estudar propriedades homológicas destes módulos com relação às singularidades dos divisores associados. Em 2024, os autores Jardim, Nejad e Simis introduzem o conceito de Grau de Bourbaki de uma curva projetiva plana, um invariante discreto que descreve comportamentos homológicos do módulo de diferenciais logarítmicas. Em 2025, os autores Faenzi, Jardim, Vallès e Muniz exploram possíveis generalizações do conceito de módulos diferenciais para subvariedades de codimensão maior em espaços projetivos, associadas à sequências de polinômios homogêneos. Nesta palestra, pretendo introduzir os conceitos acima e introduzir uma generalização do grau de Bourbaki para pares de superfícies em \\(\\mathbb{P}^3\\) , descrevendo a álgebra homológica dos módulos de diferenciais com pólos ao longo da intersecção das superfícies e outros resultados recentes obtidos em colaboração com Jardim e Nejad.</p>"

- number: 28
  speaker: "Thiago Fiel"
  affiliation: "UFPE"
  title: "Uma prova para um teorema estendido de Cox usando Koszul-Čech"
  date: "2026-04-28"
  year: 2026
  date_label: "28 de abril de 2026"
  abstract: "<p>O objetivo desta palestra é dar uma prova para uma versão estendida de um teorema de Cox-Hoffman-Wang (2008) sobre implicitização de curvas planas parametrizadas tais que o ideal de base é um ideal perfeito de altura 2. Na prova para curvas, eles utilizam uma sequência espectral Koszul-Čech e um resultado de Wiebe (1969) para prover geradores do ideal de Rees do ideal de base da parametrização. Esse resultado foi parcialmente provado anteriormente por Hong-Simis-Vasconcelos (2008). Boswell-Mukundan (2016) provaram a versão estendida desse teorema para hipersuperfícies parametrizadas, mas a prova segue uma abordagem diferente da versão para curvas. Daremos uma prova desta versão estendida usando a abordagem Koszul-Čech, seguindo a prova de Cox et al.</p>"

- number: 29
  speaker: "Thaís Dalbelo"
  affiliation: "UFSCar"
  title: "The Euler characteristic of Milnor fibers over 2-generic symmetric determinantal varieties"
  date: "2026-05-13"
  year: 2026
  date_label: "13 de maio de 2026"
  abstract: "<p>In this work we present a formula to compute the Euler characteristic of the Milnor fiber of a class of non-degenerate functions \\(f:X\\longrightarrow\\mathbb{C}\\), where \\(X\\) is a 2-generic symmetric determinantal variety. The formula is obtained in two steps. Firstly, we explicitly describe the toric structure of those varieties. Secondly, we compute volumes of Newton polyhedra arising from the toric structure. The result then follows from Matsui-Takeuchi’s formula for the Milnor fibers over toric varieties. As an application, we compute the local Euler obstruction of \\(X\\) at the origin. This, in turn, allows us to provide a family of odd-dimensional normal toric varieties with isolated singular point not satisfying Matsui-Takeuchi’s conjecture of the characterization of smoothness through the local Euler obstruction. This is a joint work with Daniel Duarte and Danilo da Nóbrega Santos.</p>"

- number: 30
  speaker: "Manoel Lemos"
  affiliation: "UFPE"
  title: "Essential cocircuits in matroids"
  date: "2026-05-22"
  year: 2026
  date_label: "22 de maio de 2026"
  abstract: "<p>Let \\(A\\) be the incidence matrix having lines and columns indexed by respectively cocircuits and elements of a matroid \\(M\\). In 2011, Lemos, Reid and Wu showed that the linear system \\(AX=0\\) has only the trivial solution provided \\(M\\) is a simple matroid. If \\(A\\) has \\(m\\) lines and \\(n\\) columns or equivalently \\(M\\) has \\(m\\) cocircuits and \\(n\\) elements, then \\(m\\ge n\\). This inequality was established independently by Basterfield and Kelly in 1968 and Greene in 1970. Moreover, they proved that equality holds if and only if \\(M\\) is a modular matroid. (Each connected component of a simple modular matroid is a projective geometry.)</p><p>Let \\(A'\\) be the matrix obtained from \\(A\\) by eliminating a line indexed by the cocircuit \\(C^*\\). When \\(A'X=0\\) has a nontrivial solution, we say that \\(C^*\\) is an essential cocircuit of \\(M\\). In this talk, we give a geometric characterization of these cocircuits. In particular, if \\(C^*\\) is an essential cocircuit of \\(M\\), then for each \\(e\\in E(M)-C^*\\) all lines containing \\(e\\) and meeting \\(C^*\\) have the same size. A cocircuit of \\(M\\) satisfying this property is essential if and only if it does not contain a line. If \\(m=n\\), then every cocircuit of \\(M\\) is essential.</p><p>It is natural to analyze the interaction of two essential cocircuits \\(C^*\\) and \\(D^*\\) that intersect. If \\(P\\) is the plane containing \\(c\\in C^*-D^*\\), \\(d\\in D^*-C^*\\), and \\(h\\in E(M)-(C^*\\cup D^*)\\), then \\(P\\) is close to being a projective plane because all lines containing \\(h\\) have the same length and intersect any other line, and all lines that do not contain \\(h\\) also have the same length (which may be different from that of the lines containing \\(h\\)). The plane \\(P\\) becomes projective when \\(h\\) belongs to another essential cocircuit of \\(M\\) meeting \\(C^*\\) or \\(D^*\\).</p><p>For a fixed essential cocircuit \\(C^*\\) of \\(M\\), let \\(Y\\) be the union of all essential cocircuits of \\(M\\) that intersect \\(C^*\\). We obtain a decomposition of \\(M\\) induced by \\(Y\\). We use this decomposition to conclude that \\(M^*|Y\\) is a connected component of \\(M^*|X\\), where \\(X\\) is the union of all non-essential cocircuits of \\(M\\). Consequently \\((M^*|Y)^*\\) is modular and so \\((M^*|X)^*\\) is also modular.</p><p>Note that for \\(M\\) to be a modular matroid, it is not necessary to assume that all its cocircuits are essential. It is sufficient that the essential cocircuits cover \\(M\\). Our result implies Basterfield, Greene and Kelly characterization of the simple matroids having as many elements as cocircuits.</p><p>This is a joint work with Jalila Rios dos Santos and Eudes Naziazeno.</p>"

- number: 31
  speaker: "Gabriel Guedes"
  affiliation: "UFRPE"
  title: "Topologias Aritméticas por primos selecionados"
  date: "2026-06-30"
  year: 2026
  date_label: "30 de junho de 2026"
  abstract: "<p>As topologias aritméticas clássicas de Furstenberg, Golomb e Kirch mostram que progressões aritméticas podem ser interpretadas como objetos topológicos. Neste seminário, apresentaremos uma abordagem seletiva, na qual apenas uma família escolhida de primos participa da construção das vizinhanças. Essa perspectiva dá origem ao programa das topologias aritméticas prime-select, cujas propriedades refletem a aritmética dos primos selecionados. O ponto de partida será a topologia associada aos primos que deixam resto um na divisão por quatro. Suas vizinhanças básicas são construídas por progressões aritméticas cujos módulos possuem somente fatores primos dessa classe. Motivada pelo teorema da soma de dois quadrados e pela aritmética dos inteiros gaussianos, a construção utiliza o radical visível para descrever fechos, interiores e critérios de densidade, distinguindo primos topologicamente visíveis e invisíveis. Também discutiremos propriedades como separação de Hausdorff, conexidade, conexidade local, não regularidade, não metrizabilidade e superconectividade, além de relações com caracteres de Dirichlet, critérios de continuidade, bijeções contínuas que não são homeomorfismos e o problema de rigidez. Por fim, vamos falar sobre a pepectiva dos trabalhos futuros. Apresentaremos extensões para domínios de Dedekind e anéis de polinômios sobre corpos finitos, bem como conexões com grafos aritméticos e novas frentes de pesquisa.</p>"

- number: 32
  speaker: "Bárbara Costa"
  affiliation: "UFRPE"
  title: "Propriedades de Lefschetz na m-Artinianização das Álgebras de Stanley–Reisner"
  date: "2026-08-18"
  year: 2026
  date_label: "18 de agosto de 2026"
  abstract: "<p>A teoria de Stanley-Reisner estabelece uma relação entre a Combinatória e a Álgebra Comutativa. A correspondência bijetiva entre complexos simpliciais e ideais monomiais, iniciada por volta de 1970, tem sido responsável por progressos em ambas as áreas. As propriedades de Lefschetz são abstrações algébricas inspiradas pelo Teorema duro de Lefschetz sobre o anel de cohomologia de variedades projetivas lisas. Esta palestra vai abordar os avanços do estudo das propriedades de Lefschetz em uma álgebra graduada artiniana associada a objetos de natureza combinatória, determinando os tipos de complexos simpliciais e matróides cuja m-artinianização do anel de Stanley-Reisner satisfaz as propriedades de Lefschetz.</p>"

- number: 33
  speaker: "Lenin Bezerra"
  affiliation: "UPE"
  title: "Compressed Artinian Gorenstein Algebras and the Macaulay Dual Generator of a Complete Intersection Ideal"
  date: "2026-09-15"
  year: 2026
  date_label: "15 de setembro de 2026"
  abstract: "<p>In this talk, I will present two different works. In the first, we study a specific family of Artinian Gorenstein algebras with compressed Hilbert functions that satisfy the Weak Lefschetz Property.</p><p>In the second, we investigate the Macaulay dual generator of the complete intersection ideal \\((X_1^{a_1},\\ldots,X_{n-1}^{a_{n-1}},G)\\), where \\(G\\) is a binomial of degree \\(c\\).</p>"

- number: 34
  speaker: "Danilo da Nóbrega Santos"
  affiliation: "UFRPE"
  title: "Variedades tóricas, poliedro de Newton e equissingularidade de Whitney"
  date: "2026-10-06"
  year: 2026
  date_label: "6 de outubro de 2026"
  abstract: "<p>Neste trabalho [2], estabelecemos condições sob as quais uma família \\(f_t\\) de funções, possivelmente com singularidades não isoladas, definida sobre uma variedade tórica, dá origem a uma família Whitney equisingular de hipersuperfícies \\(f_t^{-1}(0)\\). Em um trabalho recente [1], Eyral e Oka estabeleceram um importante arcabouço para o estudo da equisingularidade de Whitney em famílias com singularidades não isoladas em \\(\\mathbb{C}^n\\). Nossa abordagem baseia-se diretamente em seus conceitos, tais como admissibilidade, controle local e o papel das fronteiras de Newton, estendendo-os ao contexto tórico. No entanto, como as variedades tóricas podem apresentar conjuntos singulares arbitrários, essas extensões, por si só, não são suficientes. Para superar essa limitação, combinamos o arcabouço desenvolvido por eles com propriedades fundamentais das estratificações de Whitney e dos morfismos finitos, estendendo, assim, a teoria clássica ao contexto mais amplo das variedades tóricas. Além disso, quando \\(\\mathbb{C}^n\\) é visto como uma variedade tórica, nossas condições recuperam exatamente aquelas obtidas por Eyral e Oka.</p><p><strong>Referências</strong></p><ol><li>C. Eyral and M. Oka, <em>Non-compact Newton boundary and Whitney equisingularity for non-isolated singularities</em>, Advances in Mathematics, 316 (2017), 94–113.</li><li>D. N. Santos and T. M. Dalbelo, <em>Whitney equisingularity for families of hypersurfaces in toric varieties</em>, arXiv:2510.04177 (2025). <a href=\"https://arxiv.org/abs/2510.04177\">arXiv</a>.</li></ol>"

- number: 35
  speaker: "Eudes Naziazeno"
  affiliation: "UFPE"
  title: "Vai chegar o exterminador do futuro?"
  date: "2026-10-20"
  year: 2026
  date_label: "20 de outubro de 2026"
  abstract: "<p>O ser humano há séculos é acompanhado por máquinas para facilitar a resolução de problemas do cotidiano. Várias foram as perguntas que foram feitas a respeito da existência de máquinas capazes de dar respostas sobre teorias. Com o advento e a ascensão recente da inteligência artificial, esta dúvida só cresceu. Vai chegar uma máquina e acabar com o trabalho dos seres humanos? Nesta palestra, farei um breve apanhado de perguntas nesta direção e, juntamente com a definição de decidibilidade, falarei sobre a possibilidade de existirem máquinas para responder a algumas perguntas sobre a teoria de primeira ordem de anéis polinomiais indecomponíveis.</p>"
