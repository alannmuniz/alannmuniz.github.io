<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — home">
      <span class="brand-mark">AM</span>
      <span class="brand-text">
        <strong>{{ site.title }}</strong>
        <small>Mathematics · UFPE</small>
      </span>
    </a>

    <button class="menu-button" aria-expanded="false" aria-controls="site-navigation">
      <span class="menu-label">Menu</span>
      <span aria-hidden="true">☰</span>
    </button>

    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}"
           {% if page.url == item.url or page.url contains item.url and item.url != '/' %}class="active"{% endif %}>
          {{ item.title }}
        </a>
      {% endfor %}
    </nav>
  </div>
</header>
