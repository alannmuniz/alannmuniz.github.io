---
layout: default
---
<section class="page-hero">
  <div class="shell narrow">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-intro">{{ page.description }}</p>{% endif %}
  </div>
</section>

<div class="shell narrow prose">
  {{ content }}
</div>
